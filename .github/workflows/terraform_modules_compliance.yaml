name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/terraform_modules_compliance.yaml"

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@5dbf925ede6288e3b7759114da363bcadada5f1f  # main
    with:
      terraform-directories: '["terraform/charm"]'
