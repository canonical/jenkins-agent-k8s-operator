name: Terraform modules tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/test_terraform_modules.yaml"

jobs:
  terraform-tests-k8s:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@5dbf925ede6288e3b7759114da363bcadada5f1f  # main
    secrets: inherit
    with:
      k8s-controller: true
      terraform-directories: '["terraform/charm"]'
