name: Terraform modules release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"

jobs:
  terraform-release:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@5dbf925ede6288e3b7759114da363bcadada5f1f  # main
    permissions:
      contents: write
